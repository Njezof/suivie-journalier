<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Suivi Journalier</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f2ee;--paper:#fdfcfa;--card:#fff;
  --b:#e8e2d9;--b2:#d4ccc0;
  --ink:#1a1714;--ink2:#6b6259;--ink3:#b5ada4;--ink4:#d9d3cb;
  --green:#2d6a4f;--gbg:#e8f4ef;
  --orange:#c45c26;--obg:#fceee6;
  --blue:#2c5f8a;--bbg:#e6eef5;
  --purple:#6b4f8a;--pbg:#f0ebf7;
  --yellow:#8a6f1a;--ybg:#fdf6e3;
  --red:#8a2c2c;
  --serif:'Playfair Display',Georgia,serif;
  --sans:'DM Sans',sans-serif;
  --mono:'DM Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh}

/* TOP */
#top{background:var(--paper);border-bottom:1px solid var(--b);padding:0 20px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;gap:10px}
.top-l{display:flex;flex-direction:column;gap:1px;min-width:0}
.top-title{font-family:var(--serif);font-size:18px;font-weight:700;color:var(--ink);white-space:nowrap}
#top-date{font-size:10px;color:var(--ink2)}
.top-r{display:flex;align-items:center;gap:12px;flex-shrink:0}
#clock{font-family:var(--mono);font-size:16px;color:var(--ink);letter-spacing:1px;font-weight:500}
.score-area{display:flex;align-items:baseline;gap:3px}
.score-big{font-family:var(--serif);font-size:24px;font-weight:700;color:var(--ink);line-height:1}
.score-sub{font-size:10px;color:var(--ink2)}
#grade{font-family:var(--mono);font-size:15px;font-weight:500;color:var(--ink2);margin-left:3px}
#streak-badge{font-size:10px;color:var(--orange);font-family:var(--mono);font-weight:600}
.day-nav{display:flex;align-items:center;gap:5px;border-left:1px solid var(--b);padding-left:12px;flex-shrink:0}
.dn-btn{background:none;border:1px solid var(--b);color:var(--ink2);width:24px;height:24px;border-radius:5px;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.dn-btn:hover{border-color:var(--ink);color:var(--ink)}
#dn-label{font-size:10px;font-weight:600;color:var(--ink);font-family:var(--mono);white-space:nowrap;min-width:54px;text-align:center}
#dn-today{font-size:10px;padding:2px 7px;background:var(--gbg);color:var(--green);border:1px solid transparent;border-radius:9px;cursor:pointer;white-space:nowrap}
#past-banner{display:none;background:var(--ybg);border-bottom:1px solid var(--b);padding:5px 20px;font-size:11px;color:var(--yellow);font-weight:600;text-align:center}

/* NAV */
#nav{background:var(--paper);border-bottom:1px solid var(--b);display:flex;padding:0 20px}
.nav-tab{display:flex;align-items:center;gap:5px;padding:9px 14px;font-size:12px;font-weight:500;color:var(--ink2);cursor:pointer;border-bottom:2px solid transparent;transition:all .18s;user-select:none}
.nav-tab:hover{color:var(--ink)}.nav-tab.active{color:var(--ink);border-bottom-color:var(--ink)}

/* VIEWS */
.view{display:none}.view.active{display:block}

/* WORKSPACE */
#workspace{max-width:1500px;margin:0 auto;padding:14px 14px 80px;position:relative;min-height:calc(100vh - 130px)}

/* BLOCKS */
.block{position:absolute;background:var(--card);border:1px solid var(--b);border-radius:11px;overflow:visible;min-width:240px;box-shadow:0 1px 4px rgba(0,0,0,.05);transition:box-shadow .15s}
.block.dragging{box-shadow:0 10px 30px rgba(0,0,0,.15);z-index:9999;opacity:.96}
.block-handle{display:flex;align-items:center;justify-content:space-between;padding:9px 13px;border-bottom:1px solid var(--b);cursor:grab;background:var(--paper);border-radius:11px 11px 0 0}
.block-handle:active{cursor:grabbing}
.bh-l{display:flex;align-items:center;gap:6px}
.bh-icon{font-size:13px;line-height:1}
.bh-title{font-size:10px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:var(--ink2)}
.bh-r{display:flex;align-items:center;gap:5px}
.bh-badge{font-family:var(--mono);font-size:10px;color:var(--ink2);background:var(--bg);border:1px solid var(--b);padding:2px 6px;border-radius:20px;white-space:nowrap}
.block-body{padding:12px;overflow-y:auto;border-radius:0 0 11px 11px}
.block-resize{position:absolute;bottom:3px;right:3px;width:14px;height:14px;cursor:se-resize;opacity:.25;z-index:10}
.block-resize:hover{opacity:.7}
.block-resize svg{width:14px;height:14px}

/* ROWS */
.row{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--b)}
.row:last-child{border-bottom:none}
.cb{width:17px;height:17px;border-radius:50%;border:1.5px solid var(--b2);flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .18s;background:white}
.row.done .cb{background:var(--gbg);border-color:var(--green)}
.cb.sq{border-radius:4px!important}
.cb svg{display:none}.row.done .cb svg{display:block}
.et{flex:1;min-width:0;background:transparent;border:none;outline:none;font-family:var(--sans);font-size:12px;font-weight:500;color:var(--ink);border-bottom:1px solid transparent;transition:border-color .15s}
.et:focus{border-bottom-color:var(--b2)}
.row.done .et{color:var(--ink3);text-decoration:line-through}
.et-cap{text-transform:uppercase;font-size:10px;font-weight:600;letter-spacing:.4px}
.et-sub{font-size:9px;color:var(--ink2);background:transparent;border:none;outline:none;width:100%}
.et-sub:focus{border-bottom:1px solid var(--b)}
.sub-wrap{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row.done .et-cap{color:var(--ink3);text-decoration:line-through}
.xp{font-family:var(--mono);font-size:9px;color:var(--ink3);background:transparent;border:none;outline:none;width:28px;text-align:right;cursor:text;flex-shrink:0}
.xp:focus{color:var(--ink)}
.sets{font-family:var(--mono);font-size:10px;color:var(--ink2);background:var(--bg);border:none;outline:none;width:46px;text-align:center;border-radius:3px;cursor:text;padding:1px 3px}
.sets:focus{background:var(--b)}.row.done .sets{color:var(--ink3)}
.tag{font-family:var(--mono);font-size:8px;font-weight:500;padding:2px 5px;border-radius:20px;flex-shrink:0;border:none;outline:none;cursor:text;width:64px;text-align:center;text-transform:uppercase}
.x{background:none;border:none;color:var(--ink4);cursor:pointer;font-size:14px;line-height:1;padding:0 2px;flex-shrink:0;transition:color .15s}
.x:hover{color:var(--red)}
.add{display:flex;gap:5px;margin-top:9px}
.ai{flex:1;background:var(--bg);border:1px solid var(--b);color:var(--ink);font-family:var(--sans);font-size:11px;padding:5px 8px;outline:none;border-radius:6px;transition:border-color .15s}
.ai:focus{border-color:var(--b2);background:white}.ai::placeholder{color:var(--ink3)}
.ai.sm{max-width:65px}.ai.md{max-width:95px}
.ab{background:var(--bg);border:1px solid var(--b);color:var(--ink2);padding:5px 9px;cursor:pointer;border-radius:6px;font-size:13px;transition:all .15s;flex-shrink:0}
.ab:hover{border-color:var(--ink);color:var(--ink)}

/* SPORT */
.sport-sec{margin-bottom:10px}.sport-sec:last-child{margin-bottom:0}
.sec-hdr{display:flex;align-items:center;gap:6px;padding-bottom:5px;margin-bottom:3px;border-bottom:1px solid var(--b)}
.sec-name{font-size:9px;font-weight:600;letter-spacing:1.2px;color:var(--orange);text-transform:uppercase;background:transparent;border:none;outline:none;flex:1;cursor:text;font-family:var(--sans)}
.sec-name:focus{color:var(--ink);border-bottom:1px solid var(--b2)}
.add-sec{font-size:11px;color:var(--ink2);background:transparent;border:1px dashed var(--b2);padding:5px 8px;cursor:pointer;width:100%;margin-top:7px;border-radius:6px;transition:all .15s;font-family:var(--sans)}
.add-sec:hover{border-color:var(--orange);color:var(--orange);background:var(--obg)}

/* LONG TERME */
.lt{background:var(--bg);border-radius:8px;padding:9px 11px;margin-bottom:8px;border-left:3px solid var(--purple)}
.lt:last-child{margin-bottom:0}
.lt-top{display:flex;align-items:flex-start;justify-content:space-between;gap:5px}
.lt-name{font-size:12px;font-weight:600;color:var(--ink);background:transparent;border:none;outline:none;width:100%;cursor:text;margin-bottom:1px;font-family:var(--sans)}
.lt-name:focus{border-bottom:1px solid var(--b2)}
.lt-detail{font-size:10px;color:var(--ink2);background:transparent;border:none;outline:none;width:100%;cursor:text;margin-bottom:5px;font-family:var(--sans)}
.lt-detail:focus{border-bottom:1px solid var(--b)}
.lt-deadline{font-family:var(--mono);font-size:9px;color:var(--ink3);margin-bottom:5px}
.lt-bar{display:flex;align-items:center;gap:6px}
.lt-track{flex:1;height:4px;background:var(--b);border-radius:2px;overflow:hidden}
.lt-fill{height:100%;border-radius:2px;transition:width .7s ease}
.lt-pct{font-family:var(--mono);font-size:9px;color:var(--ink2);background:transparent;border:none;outline:none;width:24px;text-align:right;cursor:text}
.lt-pct:focus{color:var(--ink)}
.lt-colors{display:flex;gap:3px;margin-top:6px}
.lt-c{width:10px;height:10px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:border-color .15s}
.lt-c.on{border-color:var(--ink)}

/* SCORE */
.score-ring-wrap{display:flex;align-items:center;justify-content:center;gap:18px;padding:14px 12px 8px}
.ring-svg{position:relative;width:86px;height:86px;flex-shrink:0}
.ring-svg svg{transform:rotate(-90deg)}
.ring-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-n{font-family:var(--serif);font-size:28px;font-weight:700;color:var(--ink);line-height:1}
.ring-l{font-size:8px;color:var(--ink3);text-transform:uppercase;letter-spacing:1px;margin-top:2px}
.ms{display:flex;flex-direction:column;gap:5px}
.ms-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ms-lbl{font-size:11px;color:var(--ink2)}.ms-val{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--ink)}
.rads{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 12px 12px}
.rad{display:flex;flex-direction:column;align-items:center;gap:3px}
.rad-svg{position:relative;width:42px;height:42px}
.rad-svg svg{transform:rotate(-90deg)}
.rad-in{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;font-weight:500}
.rad-lbl{font-size:8px;color:var(--ink3);text-align:center;text-transform:uppercase;letter-spacing:.3px}
.mini-bars{display:flex;flex-direction:column;gap:5px;padding:0 12px 12px}
.mb-row{display:flex;align-items:center;gap:6px}
.mb-lbl{font-size:9px;color:var(--ink2);width:58px;text-align:right;flex-shrink:0}
.mb-track{flex:1;height:5px;background:var(--bg);border-radius:3px;overflow:hidden}
.mb-fill{height:100%;border-radius:3px;transition:width .7s ease}
.mb-pct{font-family:var(--mono);font-size:9px;color:var(--ink2);width:22px;text-align:right;flex-shrink:0}

/* NUT */
.nut-section{margin-bottom:10px}
.nut-section-title{font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--ink3);padding:0 0 5px;border-bottom:1px solid var(--border);margin-bottom:7px}
.nut-meal-row{display:flex;align-items:center;gap:5px;margin-bottom:4px}
.nut-meal-name{font-size:10px;color:var(--ink2);flex:1;min-width:0}
.nut-meal-kcal{font-family:var(--mono);font-size:9px;color:var(--ink3);width:38px;text-align:right;flex-shrink:0}
.nut-g-input{width:46px;border:1px solid var(--border);border-radius:5px;padding:2px 5px;font-size:10px;font-family:var(--mono);color:var(--ink);background:var(--bg);text-align:center}
.nut-g-input:focus{outline:none;border-color:var(--green)}
.nut-select{width:100%;border:1px solid var(--border);border-radius:6px;padding:4px 7px;font-size:10px;color:var(--ink);background:var(--bg);margin-bottom:5px}
.nut-select:focus{outline:none;border-color:var(--green)}
.nut-viande-input{width:100%;border:1px solid var(--border);border-radius:6px;padding:4px 7px;font-size:10px;color:var(--ink);background:var(--bg);margin-bottom:5px}
.nut-viande-input:focus{outline:none;border-color:var(--green)}
.nut-midi-limit{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.nut-midi-label{font-size:10px;color:var(--ink2);flex:1}
.nut-midi-bar{flex:2;height:6px;background:var(--bg);border-radius:3px;overflow:hidden}
.nut-midi-fill{height:100%;border-radius:3px;transition:width .6s}
.nut-deficit-box{background:var(--gbg);border-radius:8px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.nut-deficit-label{font-size:10px;font-weight:600;color:var(--green)}
.nut-deficit-val{font-family:var(--serif);font-size:20px;font-weight:700;color:var(--green)}
.nut-deficit-input{width:70px;border:1px solid var(--green);border-radius:6px;padding:3px 7px;font-size:12px;font-family:var(--mono);color:var(--green);background:transparent;text-align:center}
.nut-deficit-input:focus{outline:none}
.nut-burn-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;background:var(--bg);border-radius:7px;padding:7px 10px}
.nut-burn-label{font-size:10px;color:var(--ink2);flex:1}
.nut-burn-input{width:60px;border:1px solid var(--border);border-radius:5px;padding:3px 6px;font-size:11px;font-family:var(--mono);color:var(--ink);background:white;text-align:center}
.nut-total-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-top:1px solid var(--border);margin-top:5px}
.nut-total-label{font-size:10px;font-weight:600;color:var(--ink2)}
.nut-total-val{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ink)}
.nut-inputs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.nut-ig{display:flex;flex-direction:column;gap:2px}
.nut-il{font-size:9px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--ink3)}
.nut-i{width:100%;background:var(--bg);border:1px solid var(--b);color:var(--ink);font-family:var(--mono);font-size:12px;padding:5px 8px;border-radius:6px;outline:none;text-align:center}
.nut-i:focus{border-color:var(--b2);background:white}

/* POMO */
.pomo-wrap{display:flex;flex-direction:column;align-items:center;gap:9px;padding:5px 0 2px}
.pomo-ring{position:relative;width:100px;height:100px;flex-shrink:0}
.pomo-ring svg{transform:rotate(-90deg)}
.pomo-ring-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pomo-time{font-family:var(--mono);font-size:22px;font-weight:500;color:var(--ink);letter-spacing:2px}
.pomo-phase{font-size:9px;color:var(--ink2);text-transform:uppercase;letter-spacing:1px;margin-top:2px}
.pomo-btns{display:flex;gap:6px}
.pomo-btn{background:var(--bg);border:1px solid var(--b);color:var(--ink);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:11px;font-weight:600;font-family:var(--sans);transition:all .15s}
.pomo-btn.primary{background:var(--ink);color:white;border-color:var(--ink)}
.pomo-btn.danger{color:var(--red);border-color:var(--red);background:#fff5f5}
.pomo-dots{display:flex;gap:4px;align-items:center}
.pomo-dot{width:7px;height:7px;border-radius:50%;background:var(--b)}
.pomo-dot.done{background:var(--green)}
.pomo-sel{width:100%;background:var(--bg);border:1px solid var(--b);color:var(--ink);font-family:var(--sans);font-size:11px;padding:5px 8px;border-radius:6px;outline:none}

/* SCT */
.sct-row{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.sct-lbl{font-size:11px;font-weight:600;color:var(--ink);flex:1}
.sct-time{font-family:var(--mono);font-size:11px;color:var(--ink2)}
.sct-btn{background:none;border:1px solid var(--b);color:var(--ink2);padding:2px 6px;border-radius:4px;font-size:10px;cursor:pointer;transition:all .15s}
.sct-btn:hover{border-color:var(--orange);color:var(--orange)}
.sct-limit-row{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:10px;color:var(--ink2)}
.sct-limit-i{width:42px;background:var(--bg);border:1px solid var(--b);color:var(--ink);font-family:var(--mono);font-size:11px;padding:2px 6px;border-radius:4px;outline:none;text-align:center}
.sct-status{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px}

/* INTENTION */
.intention-input{width:100%;border:none;background:transparent;font-family:var(--serif);font-size:14px;font-style:italic;color:var(--ink);line-height:1.6;outline:none;resize:none;padding:3px 0}
.intention-input::placeholder{color:var(--ink3)}
.intention-hint{font-size:9px;color:var(--ink3);margin-top:4px}

/* NOTE */
textarea.note-ta{width:100%;background:var(--bg);border:1px solid var(--b);color:var(--ink);font-family:var(--sans);font-size:12px;padding:8px 10px;resize:vertical;outline:none;line-height:1.7;border-radius:6px;transition:border-color .15s}
textarea.note-ta:focus{border-color:var(--b2);background:white}
textarea.note-ta::placeholder{color:var(--ink3)}
.mood-row{display:flex;align-items:center;gap:8px;margin-top:8px}
.mood-lbl{font-size:10px;color:var(--ink2)}
.mb-e{font-size:16px;cursor:pointer;opacity:.3;filter:grayscale(1);transition:all .18s}
.mb-e:hover,.mb-e.on{opacity:1;filter:none}

/* CALENDAR */
#cal-app{max-width:1140px;margin:0 auto;padding:16px 16px 80px;display:grid;grid-template-columns:1fr 310px;gap:14px;align-items:start}
.cal-card{background:var(--card);border:1px solid var(--b);border-radius:11px;overflow:hidden}
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:12px 15px;border-bottom:1px solid var(--b)}
.cal-title{font-family:var(--serif);font-size:16px;font-weight:700;color:var(--ink)}
.cal-nav{display:flex;align-items:center;gap:6px}
.cal-arrow{background:none;border:1px solid var(--b);color:var(--ink2);width:27px;height:27px;border-radius:5px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.cal-arrow:hover{border-color:var(--ink);color:var(--ink)}
.cal-month-lbl{font-size:12px;font-weight:600;color:var(--ink);min-width:130px;text-align:center}
.cal-grid{padding:9px 13px 5px}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:3px}
.cal-dow-cell{text-align:center;font-size:9px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--ink3);padding:3px 0}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-day{aspect-ratio:1;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;padding:2px}
.cal-day:hover:not(.empty){background:var(--bg)}
.cal-day.empty{cursor:default;pointer-events:none}
.cal-day.today{border:1.5px solid var(--ink)}
.cal-day.selected{background:var(--ink)!important}
.cal-day.selected .cal-dn{color:white}
.cal-dn{font-size:11px;font-weight:600;color:var(--ink);line-height:1}
.cal-day.empty .cal-dn{visibility:hidden}
.cal-sc{width:19px;height:19px;border-radius:50%;margin-top:2px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:8px;font-weight:600}
.cal-day.selected .cal-sc{color:white!important;background:rgba(255,255,255,.15)!important}
.cal-bar{width:70%;height:3px;border-radius:2px;margin-top:2px;background:var(--b);overflow:hidden}
.cal-bar-fill{height:100%;border-radius:2px}
.cal-legend{display:flex;align-items:center;gap:11px;padding:8px 13px 12px;flex-wrap:wrap}
.leg{display:flex;align-items:center;gap:4px;font-size:9px;color:var(--ink2)}
.leg-d{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dd{padding:14px}
.dd-empty{text-align:center;padding:32px 12px;font-size:12px;color:var(--ink3);font-style:italic}
.dd-date{font-family:var(--serif);font-size:15px;font-weight:700;color:var(--ink);margin-bottom:10px}

function nutMatinCal(m){
  const skyr=Math.round((m.skyr||0)*0.6);
  const flocons=Math.round((m.flocons||0)*3.8);
  const choco=Math.round((m.choco||0)*5.3);
  const cacahu=Math.round((m.cacahu||0)*5.8);
  return skyr+flocons+choco+cacahu;
}
function nutSoirCal(s){
  if((s.mode||'salade')==='custom')return s.customCal||0;
  const salade=s.salade||0;
  if(salade===0)return 0;
  const riz=Math.round((s.rizG||80)*1.3);
  const quinoa=Math.round((s.quinoaG||80)*1.2);
  const pates=Math.round((s.patesG||80)*1.57);
  const tomat=Math.round((s.tomatG||100)*0.18);
  const maiz=Math.round((s.maizG||60)*0.86);
  const avoca=Math.round((s.avocaG||75)*1.6);
  const viande=Math.round((s.viandeG||100)*1.5);
  const thon=Math.round((s.thonG||130)*1.16);
  const oeuf=Math.round((s.oeufG||120)*1.47);
  let base_cal=tomat+maiz+avoca;
  if([1,2,3].includes(salade))base_cal+=riz;
  else if([4,5,6].includes(salade))base_cal+=quinoa;
  else if([7,8,9].includes(salade))base_cal+=pates;
  if([1,4,7].includes(salade))base_cal+=viande;
  else if([2,5,8].includes(salade))base_cal+=thon;
  else if([3,6,9].includes(salade))base_cal+=oeuf;
  return base_cal;
}

let calY=new Date().getFullYear(),calM=new Date().getMonth(),calSel=null;

function renderCal(){
  const hist=getHist();const now=new Date();const tod=hk(now.getFullYear(),now.getMonth(),now.getDate());
  document.getElementById('cal-month-lbl').textContent=`${MFR[calM]} ${calY}`;document.getElementById('cal-title').textContent=`${MFR[calM]} ${calY}`;
  document.getElementById('cal-dow').innerHTML=DFR.map(d=>`<div class="cal-dow-cell">${d}</div>`).join('');
  const first=new Date(calY,calM,1),last=new Date(calY,calM+1,0);
  let sdow=first.getDay()-1;if(sdow<0)sdow=6;
  let cells=[];for(let i=0;i<sdow;i++)cells.push({empty:true});for(let d=1;d<=last.getDate();d++)cells.push({d,y:calY,m:calM});while(cells.length%7!==0)cells.push({empty:true});
  document.getElementById('cal-days').innerHTML=cells.map(cell=>{
    if(cell.empty)return`<div class="cal-day empty"><div class="cal-dn"></div></div>`;
    const k=hk(cell.y,cell.m,cell.d),entry=hist[k],sv=entry?entry.score:0,col=sc(sv),isT=k===tod,isSel=calSel===k,has=sv>0;
    return`<div class="cal-day ${isT?'today':''} ${isSel?'selected':''}" onclick="calSel2('${k}')"><div class="cal-dn">${cell.d}</div><div class="cal-sc" style="background:${has?col+'22':'transparent'};color:${has?col:'var(--ink4)'}">${has?sv:''}</div><div class="cal-bar"><div class="cal-bar-fill" style="width:${sv}%;background:${col}"></div></div></div>`;
  }).join('');
  if(!calSel&&calY===now.getFullYear()&&calM===now.getMonth())calSel=tod;
  renderDD();
}

function calPrev(){calM--;if(calM<0){calM=11;calY--;}calSel=null;renderCal();}
function calNext(){calM++;if(calM>11){calM=0;calY++;}calSel=null;renderCal();}
function calToday(){const n=new Date();calY=n.getFullYear();calM=n.getMonth();calSel=hk(n.getFullYear(),n.getMonth(),n.getDate());renderCal();}
function renderDD(){
  const body=document.getElementById('day-detail-body');if(!calSel){body.innerHTML=`<div class="dd-empty">Sélectionne un jour</div>`;return;}
  const hist=getHist(),now=new Date(),todK=hk(now.getFullYear(),now.getMonth(),now.getDate());
  const parts=calSel.split('-');const y=parseInt(parts[0]),m=parseInt(parts[1]),d=parseInt(parts[2]);
  const dateStr=`${DLG[new Date(y,m,d).getDay()]} ${d} ${MFR[m]} ${y}`;
  let entry=null;
  if(calSel===todK){const hd=S.habits.filter(h=>h.done).length,se=S.sport.reduce((a,ss)=>a+ss.ex.filter(x=>x.done).length,0),st=S.sport.reduce((a,ss)=>a+ss.ex.length,0),od=S.objectifs.filter(o=>o.done).length;entry={score:calcSc(),h:hd,ht:S.habits.length,s:se,st,o:od,ot:S.objectifs.length,note:S.note,mood:S.mood};}
  else{entry=hist[calSel];}
  const isFuture=new Date(y,m,d)>now;
  if(!entry||entry.score===0){body.innerHTML=`<div class="dd"><div class="dd-date">${dateStr}</div><div class="dd-empty" style="padding:18px 0">${isFuture?'Jour à venir.':'Aucune donnée.'}</div>${!isFuture?`<div class="dd-go-btn"><button onclick="goCalDay(${y},${m},${d})">✏ Modifier ce jour</button></div>`:''}</div>`;return;}
  const sv=entry.score,g=sg(sv),gc=sgc(sv);
  const bars=[{l:'Habitudes',p:entry.ht?Math.round(entry.h/entry.ht*100):0,c:'#2d6a4f'},{l:'Sport',p:entry.st?Math.round(entry.s/entry.st*100):0,c:'#c45c26'},{l:'Objectifs',p:entry.ot?Math.round(entry.o/entry.ot*100):0,c:'#2c5f8a'}];
  body.innerHTML=`<div class="dd"><div class="dd-date">${dateStr}</div><div class="dd-score-row"><div class="dd-score-num">${sv}</div><div class="dd-score-side"><div class="dd-score-sub">/100 pts</div><div class="dd-grade" style="color:${gc};background:${gc}18">${g}</div></div>${entry.mood?`<div class="dd-mood">${ME[entry.mood]||''}</div>`:''}</div><div class="dd-section"><div class="dd-st">Progression</div>${bars.map(b=>`<div class="dd-bar-row"><div class="dd-bar-lbl">${b.l}</div><div class="dd-bar-track"><div class="dd-bar-fill" style="width:${b.p}%;background:${b.c}"></div></div><div class="dd-bar-pct">${b.p}%</div></div>`).join('')}</div>${entry.note?`<div class="dd-st">Note</div><div class="dd-note">${e(entry.note)}</div>`:''}<div class="dd-go-btn"><button onclick="goCalDay(${y},${m},${d})">✏ Modifier ce jour</button></div></div>`;
}
function goCalDay(y,m,d){saveDay();viewDate=new Date(y,m,d);isPast=dk(viewDate)!==todayK();loadDay(viewDate);updNav();const tabs=document.querySelectorAll('.nav-tab');switchView('suivi',tabs[0]);renderAll();}
// ═══════════════ STREAK ═══════════════
function updStreak(){const hist=getHist();let streak=0;const now=new Date();for(let i=0;i<365;i++){const d=new Date(now);d.setDate(d.getDate()-i);const k=`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;if(hist[k]&&hist[k].score>=50)streak++;else if(i>0)break;}const el=document.getElementById('streak-badge');if(el)el.textContent=streak>=2?`🔥 ${streak}j`:'';}
// ═══════════════ INIT ═══════════════
loadLay();viewDate=new Date();isPast=false;loadDay(viewDate);updNav();buildWS();renderAll();updStreak();
// Pull cloud data on startup
pullFromCloud();
// Re-sync every 30s si un autre appareil a modifié
setInterval(pullFromCloud,30000);
setInterval(tick,1000);tick();
setInterval(()=>{if(dk(new Date())!==dk(viewDate)&&!isPast){saveDay();viewDate=new Date();loadDay(viewDate);updNav();renderAll();}},60000);
</script>
</body>
